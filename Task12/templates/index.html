<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smartphone Company Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>📱 Smartphone Company Predictor</h1>
    <p class="subtitle">Enter smartphone specifications to predict the Company</p>

    <div class="container">
        <form action="/predict" method="post">
            <label for="OS">Operating System</label>
            <select name="OS" id="OS" required>
                <option value="">-- Select OS --</option>
                <option value="Android">Android</option>
                <option value="IOS">IOS</option>
                <option value="windows">Windows</option>
            </select>

            <label for="Capacity">Storage Capacity (GB)</label>
            <input type="number" name="Capacity" id="Capacity" placeholder="e.g. 64" min="8" max="512" required>

            <label for="Ram">RAM (GB)</label>
            <input type="number" name="Ram" id="Ram" placeholder="e.g. 4" min="1" max="16" required>

            <label for="Weight">Weight (grams)</label>
            <input type="number" name="Weight" id="Weight" placeholder="e.g. 150" min="100" max="300" required>

            <label for="inch">Screen Size (inches)</label>
            <input type="number" name="inch" id="inch" placeholder="e.g. 6.1" step="0.1" min="4" max="8" required>

            <label for="year">Release Year</label>
            <input type="number" name="year" id="year" placeholder="e.g. 2020" min="2010" max="2025" required>

            <button type="submit">🔍 Predict Company</button>
        </form>

        {% if prediction_text %}
            <div class="result">
                <h2>{{ prediction_text }}</h2>
            </div>
        {% endif %}
    </div>

    <div class="footer">
        <p>AI Lab 12 — Flask Model Deployment | Smartphones Dataset</p>
    </div>
</body>
</html>
